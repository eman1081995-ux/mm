<title>يوم مختلف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* تصميم «يوم مختلف»: مدينة بألوان الأحمر والأصفر، وتوهّج الخلفية يتبع ساعات اليوم. التقرير نهاري.
   الألوان ثابتة عمدًا (مظهر واحد)، مع تحديد الخلفية والنصوص صراحةً. */
:root {
  --red: #DA291C; --red-deep: #8E1B12; --night: #230C0A; --night-2: #3A1311;
  --yellow: #FFC72C; --yellow-deep: #E0A100; --yellow-soft: #FFE59A;
  --ink: #2A130F; --ink-soft: #5E3F38; --paper: #FFFFFF; --sand: #FFF1CC; --line: #F0D9A6;
  --font-display: 'Cairo', 'Tajawal', system-ui, sans-serif;
  --font-body: 'Tajawal', 'Cairo', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { direction: rtl; height: 100%; }
body {
  margin: 0; min-height: 100%; direction: rtl;
  background: var(--night); color: #fff; font-family: var(--font-body); font-size: 17px; line-height: 1.7;
  padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.day { background: var(--sand); color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
body.day::before { background: var(--yellow); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.25; text-wrap: balance; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: linear-gradient(180deg, var(--night-2) 0%, var(--night) 100%); }
.sky .glow { position: absolute; left: -25%; right: -25%; top: -30%; height: 70%; border-radius: 50%; background: var(--glow, #FFC72C); filter: blur(70px); opacity: .42; transition: background 1.2s ease; }
body.day .sky { background: linear-gradient(180deg, var(--yellow) 0%, var(--yellow-soft) 22%, var(--sand) 55%); }
.sky .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--yellow-soft); opacity: 0; transition: opacity 1s; animation: tw 4s ease-in-out infinite; }
body.late .sky .star { opacity: .7; }
.sky .city { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22vh; min-height: 110px; opacity: .85; }
body.day .sky .glow, body.day .sky .star, body.day .sky .city { display: none; }
@keyframes tw { 50% { opacity: .15; transform: scale(.7); } }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 24px; animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- الأزرار ---------- */
.btn { appearance: none; border: 0; cursor: pointer; min-height: 52px; padding: 12px 22px; border-radius: 14px; font-size: 18px; font-weight: 800; font-family: var(--font-display);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, box-shadow .12s; text-align: center; }
.btn.primary { background: var(--yellow); color: var(--ink); box-shadow: 0 5px 0 var(--yellow-deep); }
.btn.primary:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--yellow-deep); }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--red-deep); }
.btn.red:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-deep); }
.btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.45); }
body.day .btn.ghost { color: var(--ink); border-color: var(--ink); }
.btn.big { min-height: 60px; font-size: 21px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; }

/* ---------- شاشة البداية ---------- */
.hero { text-align: center; align-items: center; padding-top: 28px; }
.orb { width: 84px; height: 84px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 10px rgba(255,199,44,.2), 0 0 60px rgba(255,199,44,.6); animation: pulse 3s infinite; }
.kicker { font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; color: var(--yellow); font-size: 15px; }
.hero .en { font-family: var(--font-display); font-weight: 700; letter-spacing: .18em; color: var(--yellow); margin-top: -10px; direction: ltr; }
.hero h1 { font-size: clamp(44px, 14vw, 68px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 var(--red); }
.lead { font-size: 19px; color: #FFE9B8; max-width: 34ch; margin: 0; }
.cast { display: flex; justify-content: center; gap: 4px; margin: 6px 0 2px; }
.cast .av { width: 22vw; max-width: 104px; }
.clock { font-family: var(--font-display); font-weight: 900; font-size: 30px; color: var(--yellow); background: rgba(0,0,0,.28); border: 2px solid rgba(255,199,44,.5); border-radius: 14px; padding: 2px 16px; direction: ltr; }
.hint { font-size: 14px; color: #E6C79A; margin: 0; }

/* ---------- الشخصيات ---------- */
.av { display: block; width: 120px; height: auto; animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
.av:nth-child(2) { animation-delay: -.8s; } .av:nth-child(3) { animation-delay: -1.6s; } .av:nth-child(4) { animation-delay: -2.4s; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-1deg); } }

/* ---------- شريط التقدم ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: -16px; padding: 10px 16px 12px; background: linear-gradient(180deg, var(--night) 70%, rgba(35,12,10,0)); }
.trail { display: flex; align-items: center; gap: 0; }
.trail .stop { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,199,44,.55); background: transparent; position: relative; z-index: 1; }
.trail .stop.done { background: var(--yellow); border-color: var(--yellow); }
.trail .stop.now { background: var(--red); border-color: var(--yellow); box-shadow: 0 0 0 5px rgba(255,199,44,.25); animation: pulse 1.8s infinite; }
.trail .seg { flex: 1 1 0; height: 0; border-top: 3px dotted rgba(255,199,44,.35); }
.trail .seg.done { border-top: 3px solid var(--yellow); }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255,199,44,.06); } }
.hud .cap { display: flex; justify-content: space-between; margin-top: 7px; font-size: 14px; color: #E6C79A; font-weight: 500; }
.hud .cap b { color: var(--yellow); font-family: var(--font-display); }

/* ---------- المشهد ---------- */
.scene { position: relative; height: 176px; border-radius: 20px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,.3); background: #E8D9C3; }
.scene .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .av { position: absolute; right: 18px; bottom: -6px; width: 118px; animation: none; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
.scene .tchip { position: absolute; top: 10px; left: 10px; background: rgba(35,12,10,.82); color: var(--yellow); font-family: var(--font-display); font-weight: 800; font-size: 14px; padding: 2px 12px; border-radius: 999px; direction: ltr; }
.who { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 12px; padding: 4px 12px; max-width: 52%; }
.who b { font-family: var(--font-display); font-size: 17px; color: var(--red); line-height: 1.3; }
.who span { font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.ctx { display: flex; flex-direction: column; gap: 4px; border-inline-start: 4px solid var(--yellow); background: rgba(255,199,44,.12); border-radius: 12px; padding: 8px 12px; font-size: 15px; color: #FFF1CC; }
.ctx b { font-family: var(--font-display); color: var(--yellow); font-size: 13.5px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-end; opacity: 0; animation: rise .45s ease forwards; }
.msg .face { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--yellow); background: #FFE59A; }
.msg .mb { background: #fff; color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 8px 14px; display: flex; flex-direction: column; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.msg .mb b { font-family: var(--font-display); font-size: 13.5px; color: var(--red); line-height: 1.4; }
.msg .mb span { font-size: 16.5px; line-height: 1.55; }
.notif { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 16px; padding: 10px 14px; backdrop-filter: blur(6px); }
.notif i { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; background: var(--red); position: relative; }
.notif i::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--yellow); }
.notif div { display: flex; flex-direction: column; min-width: 0; }
.notif b { font-family: var(--font-display); font-size: 14px; color: var(--yellow); direction: ltr; text-align: right; }
.notif span { font-size: 15.5px; color: #FFF1CC; }
.bubble { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 16px 18px; position: relative; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.bubble h2 { font-size: 22px; color: var(--red); margin-bottom: 6px; }
.bubble p { margin: 0; font-size: 17.5px; }
.tag { display: inline-block; align-self: flex-start; background: rgba(255,199,44,.16); color: var(--yellow); border: 1px solid rgba(255,199,44,.5); border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { appearance: none; width: 100%; cursor: pointer; text-align: right; display: flex; gap: 12px; align-items: flex-start; border: 0; border-radius: 16px;
  background: #FFF8E6; color: var(--ink); padding: 15px 16px; font-size: 17.5px; line-height: 1.6; font-weight: 500; box-shadow: 0 5px 0 var(--yellow-deep); transition: transform .12s, box-shadow .12s, background .15s; }
.opt:hover { background: #FFFFFF; }
.opt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--yellow-deep); }
.opt .mark { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--red); margin-top: 2px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 15px; color: #fff; }
.opt.sel { background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--red-deep); }
.opt.sel .mark { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }

/* ---------- النتيجة الفورية ---------- */
.card { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,.22); }
.card .lbl { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--red); letter-spacing: .04em; margin-bottom: 4px; }
.card p { margin: 0; }
.card + .card { margin-top: 0; }
.order { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.order li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.order b { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 14px; }

.chapter { text-align: center; align-items: center; padding-top: 44px; }
.chapter .num { font-family: var(--font-display); font-weight: 800; color: var(--yellow); font-size: 20px; letter-spacing: .06em; }
.chapter h2 { font-size: clamp(36px, 11vw, 52px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--red); }
.chapter p { max-width: 32ch; margin: 0; color: #FFE9B8; font-size: 19px; }

.spark { position: fixed; z-index: 50; width: 10px; height: 10px; background: var(--yellow); border-radius: 2px; pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }

.loading { text-align: center; align-items: center; padding-top: 80px; }
.phases { display: flex; gap: 10px; }
.phases i { width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); animation: ph 1.6s infinite; opacity: .25; }
.phases i:nth-child(2) { animation-delay: .2s; } .phases i:nth-child(3) { animation-delay: .4s; } .phases i:nth-child(4) { animation-delay: .6s; } .phases i:nth-child(5) { animation-delay: .8s; }
@keyframes ph { 50% { opacity: 1; transform: scale(1.25); } }

/* ---------- الخصوصية والتعليمات ---------- */
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps b { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--font-display); }
.notice { border: 2px solid var(--yellow); border-radius: 16px; padding: 14px 16px; background: rgba(255,199,44,.1); color: #FFF1CC; font-size: 16px; }
.notice b { color: var(--yellow); font-family: var(--font-display); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; color: var(--yellow); }
.field input { font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 14px; border: 3px solid var(--yellow); background: #fff; color: var(--ink); width: 100%; }

/* ---------- التقرير (نهاري) ---------- */
.report { gap: 18px; }
.r-head { background: var(--red); color: #fff; border-radius: 22px; padding: 22px 20px 20px; position: relative; overflow: hidden; box-shadow: 0 7px 0 var(--red-deep); }
.r-head h1 { font-size: clamp(30px, 9vw, 40px); font-weight: 900; color: #fff; }
.r-head .who2 { color: var(--yellow-soft); margin-top: 4px; font-size: 17px; }
.r-head .date { color: #FFD3CD; font-size: 14px; }
.print-mark { position: absolute; left: -26px; top: -22px; width: 150px; opacity: .22; }
.r-sum { font-size: 18px; margin-top: 12px; color: #fff; }
.sec-t { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900; color: var(--red-deep); margin-top: 6px; }
.sec-t svg { width: 28px; height: 28px; flex: 0 0 auto; }
.rc { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.rc.pri { border-color: var(--yellow); }
.rc h3 { font-size: 22px; font-weight: 800; color: var(--ink); }
.rc .chip { align-self: flex-start; font-family: var(--font-display); font-weight: 700; font-size: 13.5px; background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 2px 12px; }
.rc .chip.soft { background: #FBE9E7; color: var(--red-deep); }
.rc h4 { margin: 0; font-family: var(--font-display); font-size: 15px; color: var(--red); letter-spacing: .03em; }
.rc p, .rc li { margin: 0; font-size: 16.5px; color: var(--ink); }
.rc ul { margin: 0; padding: 0 20px 0 0; display: flex; flex-direction: column; gap: 8px; }
.rc .def { color: var(--ink-soft); }
.ex { background: #FFF8E6; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; }
.ex small { display: block; color: var(--ink-soft); font-size: 14.5px; margin-top: 2px; }
.tip { background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; }
.tip h4 { color: var(--yellow); }
.read { background: #fff; border: 2px dashed var(--yellow-deep); border-radius: 18px; padding: 16px 18px; color: var(--ink); }
.read h3 { font-size: 19px; color: var(--red-deep); margin-bottom: 6px; }
.read ul { margin: 0; padding: 0 20px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.35); }

@media (max-width: 380px) { .scene .av { width: 100px; } .opt, .bubble p { font-size: 16.5px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print {
  body, body.day { background: #fff !important; color: #000; padding: 0; }
  body::before, .sky, .actions, .no-print, .toast { display: none !important; }
  .app { max-width: none; } .screen { animation: none; padding: 0; }
  .r-head { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rc, .read { break-inside: avoid; box-shadow: none; }
  .tip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>
<div id="app" class="app"></div>
<script>
/* ============================================================
   يوم مختلف | A Different Day: محتوى اللعبة (قابل للتعديل دون المساس بالواجهة أو المحرك)
   المرجع الوحيد للكفاءات والسلوكيات: ملف SMX المرفق
   ------------------------------------------------------------
   الإشارة (signal) = S(الكفاءة، الاتجاه، القوة، المرجع، الملاحظة)
     الاتجاه: +1 سلوك إيجابي مذكور في الملف | -1 يطابق بندًا من «ما لا تعنيه» | 0 محايد
     القوة:   1 = مطابقة مباشرة | 0.5 = دلالة جزئية (استنتاج معقول)
     المرجع:  رقم سلوك (B) أو بند «ما لا تعنيه» (N) من الجداول أدناه
   ============================================================ */
(function (root) {
  const S = (c, d, k, r, n) => ({ c, d, k, r, n });

  const competencies = [
    { id: 'CU', name: 'الشغف بإرضاء العميل',
      means: ['كن مستجيبًا لاحتياجات العملاء.', 'السعي الدائم لإيجاد طرق حديثة لتحسين تجربة العملاء.', 'السؤال باستمرار: «ما هو تقييم عملائنا لما نقوم به؟»'] },
    { id: 'FO', name: 'التركيز على الأكثر أهمية',
      means: ['تنفيذ أشياء قليلة بشكل أفضل.', 'التركيز المستمر على الأشياء التي سيكون لها التأثير الأكبر.', 'إلزام النفس والآخرين بالمسؤولية في تحقيق النتائج.'] },
    { id: 'TA', name: 'الإرتقاء وتطوير الكوادر المتميزة',
      means: ['الارتقاء المستمر بالمواهب في مختلف مستويات العمل.', 'توجيه الآخرين لإسراع عملية التعلم والتطوير.', 'تشجيع التنوع في الأفكار ووجهات النظر.'] },
    { id: 'CO', name: 'التواصل بفاعلية وصراحة',
      means: ['إظهار مهارات تواصل قوية (مهارات إرسال ومهارات استقبال).', 'توصيل المعلومات والأفكار بطريقة منفتحة ومعبّرة وفي الأوقات المناسبة.', 'الأخذ في الاعتبار الاختلافات الثقافية ووجهات نظر الآخرين عند التواصل.'] },
    { id: 'CH', name: 'قيادة التغيير والإبتكار',
      means: ['تحديد الاحتياجات المتغيرة لعملائنا والموظفين والنظام.', 'قيادة الابتكار الذي يطوّر الأعمال بنجاح.'] },
    { id: 'PL', name: 'التخطيط والعمل بشكل إستراتيجي',
      means: ['وضع رؤية أو استراتيجية أو خطة عمل واضحة ومقنعة.', 'ضمان التوافق مع أهداف المطعم والمؤسسة.'] },
    { id: 'TW', name: 'تحقيق الأهداف من خلال العمل الجماعى',
      means: ['العمل بشكل تعاوني كعضو في الفريق.', 'الالتزام بأهداف الفريق بشكل كلي بدلًا من الاهتمامات الخاصة.', 'الانفتاح لأفكار الآخرين المتنوعة.', 'تعزيز اختلافات الفريق لتحقيق النتائج.'] },
    { id: 'IN', name: 'القيادة من خلال التأثير',
      means: ['التأثير إيجابيًا على الآخرين.', 'التعاون بطرق تلهم الآخرين لاتخاذ إجراءات و/أو تغيير المنظور.'] }
  ];

  /* السلوكيات المتوقعة (من قوائم Behaviors). السلوكيات المقطوعة في الصور لم تُدرج. */
  const behaviors = {
    CU1: 'يفهم كيف تقدم ماكدونالدز القيمة للعملاء.',
    CU2: 'هو مستهلك ملتزم وملاحظ جيد لتجربة العملاء خلال التفاعل مع ماكدونالدز ومنافسينا والعلامات التجارية الأخرى.',

   2) في مواقف الاختيار الواحد: مساهمة الكفاءة = اتجاه × قوة الإشارة.

      المرتبة بأوزان 3:2:1 (طريقة Borda المعروفة)، فتبقى النتيجة بين -1 و+1
      مثل بقية المواقف.
   4) مؤشر الكفاءة = متوسط مساهماتها عبر مواقفها (فتتساوى الكفاءات رغم اختلاف الفرص).
   5) المؤشر نسبي: يقارن كفاءات اللاعب ببعضها، وليس مستوى مطلقًا.
   ============================================================ */

  function analyze(content, answers, cfg) {
    cfg = Object.assign({}, CFG, cfg || {});
    const W = cfg.rankWeights, WS = W.reduce((a, b) => a + b, 0);
    const per = {};
    content.competencies.forEach(c => { per[c.id] = { id: c.id, ev: [] }; });
    const answered = Object.keys(answers).sort().join(',');
    const seed = hashStr(JSON.stringify(answers));

    for (const sc of content.scenarios) {
      const a = answers[sc.id]; if (!a) continue;
      for (const c of sc.comps) {
        let val = 0, best = null;
        if (sc.type === 'rank') {
          a.rank.forEach((oid, i) => {
            const o = getOpt(sc, oid); const r = optVal(o, c);
            val += W[i] * r.v;
            const m = Math.abs(W[i] * r.v);
            if (r.sigs.length && (!best || m > best.m)) best = { o, sigs: r.sigs, m, pos: i };
          });
          val /= WS;
          if (!best) { const o = getOpt(sc, a.rank[0]); best = { o, sigs: [], m: 0, pos: 0 }; }
        } else {
          const o = getOpt(sc, a.pick); const r = optVal(o, c); val = r.v; best = { o, sigs: r.sigs, m: 0, pos: 0 };
        }
        per[c].ev.push({ sid: sc.id, title: sc.title, val, opt: best.o, sigs: best.sigs, pos: best.pos, rank: sc.type === 'rank' });
      }
    }

    const ids = Object.keys(per);
    ids.forEach(c => {
      const p = per[c], vals = p.ev.map(e => e.val);
      p.n = vals.length;
      p.idx = mean(vals);
      p.spread = std(vals);
      p.posEv = p.ev.filter(e => e.val > 0);
      p.negEv = p.ev.filter(e => e.val < 0);
      p.lowCount = p.ev.filter(e => e.val <= 0).length;
      p.contradictory = p.spread >= cfg.highSpread;
    });

    // أولويات التطوير: الأقل مؤشرًا (نسبيًا). كسر التعادل: دلائل تطوير أكثر ثم تدوير ثابت من إجابات اللاعب نفسها (لا عشوائية)
    const order = ids.slice().sort((x, y) => {
      const a = per[x], b = per[y];
      if (Math.abs(a.idx - b.idx) > 1e-9) return a.idx - b.idx;
      if (a.negEv.length !== b.negEv.length) return b.negEv.length - a.negEv.length;
      return ((ids.indexOf(x) * 7919 + seed) % 97) - ((ids.indexOf(y) * 7919 + seed) % 97);
    });
    let k = 2;
    const third = per[order[2]];
    if (third && (third.idx - per[order[1]].idx <= cfg.closeGap || third.negEv.length >= cfg.thirdNegCount)) k = 3;
    const sel = order.slice(0, k);
    const nextOut = per[order[k]];

    const priorities = sel.map(c => {
      const p = per[c];
      let score = 0;
      score += p.lowCount >= 3 ? 2 : p.lowCount === 2 ? 1 : 0;
      score += (nextOut.idx - p.idx) >= cfg.confGap ? 1 : 0;
      score -= p.contradictory ? 1 : 0;
      const confidence = score >= 3 ? 'high' : score >= 1 ? 'medium' : 'low';
      const potential = p.negEv.length === 0; // لا دليل تطوير قوي: «فرصة نمو محتملة»
      return { id: c, idx: p.idx, confidence, potential, contradictory: p.contradictory, lowCount: p.lowCount, n: p.n };
    });

    const strengthOrder = ids.filter(c => !sel.includes(c) && per[c].posEv.length >= 1 && per[c].idx >= cfg.strengthMin)
      .sort((x, y) => per[y].idx - per[x].idx);
    const strengths = strengthOrder.slice(0, 3).map(c => ({ id: c, idx: per[c].idx }));

    return { per, order, priorities, strengths, answered: Object.keys(answers).length, cfg };
  }

  /* ---- أدوات المحاكاة (للاختبار ولوحة المصمّمة) ---- */
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function simulate(content, policy, rng) {
    const answers = {};
    content.scenarios.forEach((sc, i) => {
      if (sc.type === 'rank') {
        const scored = sc.options.map(o => ({ id: o.id, s: policy(sc, o, i, rng) }));
        scored.sort((a, b) => b.s - a.s);
        answers[sc.id] = { rank: scored.slice(0, 3).map(x => x.id) };
      } else {
        let best = null;
        sc.options.forEach(o => { const s = policy(sc, o, i, rng); if (!best || s > best.s) best = { id: o.id, s }; });
        answers[sc.id] = { pick: best.id };
      }
    });

  }

    return (sc, o, i, rng) => {
      let s = 0; for (const c of sc.comps) s += (w[c] === undefined ? 0 : w[c]) * optVal(o, c).v;
      return s + noise * rng();
    };
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = ENGINE;

    return `<section class="screen">
      <h2 style="font-size:30px;color:var(--yellow)">نناديك إيه؟</h2>
      <div class="field"><label for="nm">اسمك (اختياري)</label><input id="nm" type="text" maxlength="30" autocomplete="off" placeholder="هيظهر في التقرير بس" value="${esc(S.name)}"></div>
      <button class="btn red big" data-act="begin">ابدأ اليوم</button>
      <button class="btn ghost" data-act="begin" data-skip="1">عدّي الخطوة دي</button>
    </section>`;
  }
  function chapterScreen() {
    const ch = chOf(scOf(S.idx).ch);
    return hud() + `<section class="screen chapter">
      <div class="clock">${esc(ch.time)}</div><div class="num">المحطة ${ch.n}</div><h2>${esc(ch.name)}</h2><p>${esc(ch.intro)}</p>
      <button class="btn primary big" data-act="next">يلا</button></section>`;
  }
  function optsHTML(sc) {
    return S.order[sc.id].map((oid, i) => {
      const o = sc.options.find(x => x.id === oid);
      let sel = false, mk = AR[i];
      if (sc.type === 'rank') { const k = S.rank.indexOf(oid); sel = k >= 0; mk = sel ? NUM[k] : ''; }
      else { sel = S.pick === oid; if (sel) mk = '✓'; }
      return `<button class="opt${sel ? ' sel' : ''}" data-act="opt" data-id="${oid}" aria-pressed="${sel}"><span class="mark">${mk}</span><span>${esc(o.t)}</span></button>`;
    }).join('');
  }
  function sceneScreen() {
    const sc = scOf(S.idx), p = G.people[sc.who];
    const ready = sc.type === 'rank' ? S.rank.length === 3 : S.pick !== null;
    const ctx = (sc.ctx || []).filter(c => S.flags[c.if]).slice(0, 2);
    const say = (sc.say || []).map((m, i) => { const w = G.people[m.w] || p; return `<div class="msg" style="animation-delay:${.25 + i * .5}s">${face(m.w)}<div class="mb"><b>${esc(w.name)}</b><span>${esc(m.t)}</span></div></div>`; }).join('');
    return hud() + `<section class="screen">
      <div class="scene">${placeSVG(sc.place, SKY[sc.ch])}<span class="tchip">${esc(sc.time || '')}</span>${avatar(sc.who)}<div class="who"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div></div>
      ${ctx.length ? `<div class="ctx"><b>من اللي حصل قبل كده</b>${ctx.map(c => `<span>${esc(c.t)}</span>`).join('')}</div>` : ''}
      <div class="bubble"><h2>${esc(sc.title)}</h2><p>${esc(sc.text)}</p></div>
      ${say ? `<div class="chat">${say}</div>` : ''}
      ${sc.type === 'rank' ? '<span class="tag">اضغط على ٣ قرارات بالترتيب: الأول ثم التاني ثم التالت</span>' : ''}
      <div class="opts">${optsHTML(sc)}</div>
      <button class="btn red big" data-act="confirm" ${ready ? '' : 'disabled'}>${sc.type === 'rank' ? 'أعتمد الترتيب ده' : 'أعتمد قراري'}</button>
    </section>`;
  }
  function outcomeScreen() {
    const sc = scOf(S.idx), a = S.answers[sc.id];
    const first = sc.options.find(o => o.id === (a.rank ? a.rank[0] : a.pick));
    const note = G.filler[S.idx % G.filler.length];
    let order = '';
    if (a.rank) order = `<ol class="order">${a.rank.map((id, i) => `<li><b>${NUM[i]}</b><span>${esc(sc.options.find(o => o.id === id).t)}</span></li>`).join('')}</ol>`;
    const last = S.idx === G.scenarios.length - 1;
    return hud() + `<section class="screen">
      <div class="notif"><i aria-hidden="true"></i><div><b>${esc(sc.time || '')}</b><span>${esc(note)}</span></div></div>
      ${a.rank ? `<div class="card"><div class="lbl">ترتيبك</div>${order}</div>` : ''}
      <div class="card"><div class="lbl">اللي حصل بعد كده</div><p>${esc(first.o)}</p></div>
      <button class="btn primary big" data-act="cont">${last ? 'اكتشف بصمتك القيادية' : 'كمّل اليوم'}</button>
    </section>`;
  }
  function loadingScreen() {
    return `<section class="screen loading"><div class="phases"><i></i><i></i><i></i><i></i><i></i></div>
      <h2 style="font-size:30px;color:var(--yellow)">اليوم قرّب يخلص</h2><p class="lead">بنجمّع قصة يومك ونقرأ اللي بتقوله قراراتك...</p></section>`;
  }

  /* ---------- التقرير الشخصي ---------- */
  const behKeys = id => Object.keys(G.behaviors).filter(k => new RegExp('^' + id + '\\d').test(k));
  function buildReport(res, name) {
    const pris = res.priorities.map(p => {
      const c = comp(p.id), per = res.per[p.id];
      const evs = per.ev.slice().sort((a, b) => a.val - b.val);
      const examples = evs.slice(0, 2).map(ev => {
        const note = (ev.sigs.find(s => s.d <= 0) || ev.sigs[0] || {}).n;
        const line = ev.rank ? `في «${ev.title}» جاء في ترتيبك (المرتبة ${NUM[ev.pos]}): «${ev.opt.t}»` : `في «${ev.title}» اخترت: «${ev.opt.t}»`;
        return { line, note: note ? `ما يعكسه ذلك: ${note}` : '' };
      });
      const shown = new Set();
      per.ev.forEach(ev => { if (ev.val > 0) ev.sigs.forEach(s => { if (s.d > 0) shown.add(s.r); }); });
      const measured = []; G.scenarios.forEach(sc => sc.options.forEach(o => o.s.forEach(s => { if (s.c === p.id && s.d > 0 && !measured.includes(s.r)) measured.push(s.r); })));
      const cand = measured.filter(r => !shown.has(r)).concat(behKeys(p.id).filter(r => !shown.has(r) && !measured.includes(r)));
      const improve = cand.slice(0, 3);
      const why = p.potential
        ? `لم تظهر هذه الكفاءة بوضوح في أغلب قراراتك داخل اليوم (${p.lowCount} من ${p.n} مواقف). هذا لا يعني ضعفًا، فقد فضّلت أولويات أخرى كانت مناسبة لسياقها، ونراها فرصة نمو محتملة.`
        : `ظهرت في ${p.lowCount} من ${p.n} مواقف قرارات تميل إلى أسلوب مختلف عمّا تصفه هذه الكفاءة، لذلك تبدو فرصة جيدة لتعزيزها.`;
      const confTxt = { high: 'مرتفع: الإشارات متسقة وواضحة نسبيًا.', medium: 'متوسط: الأدلة كافية لاقتراح الأولوية، وستتضح الصورة أكثر بالممارسة.', low: 'منخفض: الأدلة متقاربة، فاعتبرها اتجاهًا أوليًا للنقاش وليس حكمًا.' }[p.confidence];
      return { id: p.id, name: c.name, def: c.means[0], chip: p.potential ? 'فرصة نمو محتملة' : 'أولوية تطوير', why, contra: p.contradictory ? 'اختلف أسلوبك من موقف لآخر، وهذا طبيعي حين تتغير السياقات.' : '', conf: confTxt, examples, improve: improve.map(r => G.behaviors[r]), tip: cand.length ? G.tips[cand[0]] : G.tips[behKeys(p.id)[0]] };
    });
    const strs = res.strengths.map(s => {
      const c = comp(s.id), per = res.per[s.id];
      const best = per.ev.slice().sort((a, b) => b.val - a.val)[0];
      const sig = best.sigs.find(x => x.d > 0);
      return { name: c.name, line: best.rank ? `في «${best.title}» جاء في ترتيبك: «${best.opt.t}»` : `في «${best.title}» اخترت: «${best.opt.t}»`, beh: sig ? G.behaviors[sig.r] : '' };
    });
    const names = strs.map(s => '«' + s.name + '»');
    const summary = (name ? name + '، ' : '') + (names.length ? `ظهر في قراراتك حضور لافت في ${names.slice(0, 2).join(' و')}. ` : '') +
      `وبحسب اختياراتك، أقرب فرص النمو هي: ${pris.map(p => '«' + p.name + '»').join(' و')}.`;
    return { name, summary, pris, strs, date: new Date().toLocaleDateString('ar-EG') };
  }

  function reportScreen() {
    const R = S.report;
    return `<section class="screen report">
      <div class="r-head">${sunMark}
        <div class="date">${esc(R.date)}</div><h1>اكتشف بصمتك القيادية</h1>
        <p class="r-sum">${esc(R.summary)}</p></div>
      <div class="sec-t">${flagIcon}<span>نقاط قوتك</span></div>
      ${R.strs.map(s => `<div class="rc"><h3>${esc(s.name)}</h3>${s.beh ? `<div><h4>سلوك ظهر في قراراتك</h4><p>${esc(s.beh)}</p></div>` : ''}<div class="ex">${esc(s.line)}</div></div>`).join('')}
      <div class="sec-t">${rocketIcon}<span>فرصتك القادمة للتطور</span></div>
      ${R.pris.map(p => `<div class="rc pri">
        <span class="chip ${p.chip.startsWith('فرصة') ? 'soft' : ''}">${esc(p.chip)}</span>
        <h3>${esc(p.name)}</h3>
        <p class="def">${esc(p.def)}</p>
        <div><h4>لماذا ظهرت هنا؟</h4><p>${esc(p.why)} ${esc(p.contra)}</p></div>
        <div><h4>من قراراتك في اليوم</h4>${p.examples.map(x => `<div class="ex">${esc(x.line)}${x.note ? `<small>${esc(x.note)}</small>` : ''}</div>`).join('')}</div>
        <div><h4>سلوكيات يمكنك تحسينها</h4><ul>${p.improve.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>
        <div class="tip"><h4>اقتراح عملي في بيئة العمل</h4><p>${esc(p.tip)}</p></div>
        <p class="def" style="font-size:14.5px">مستوى الثقة: ${esc(p.conf)}</p>
      </div>`).join('')}
      <div class="read"><h3>كيف تقرأ هذا التقرير؟</h3><ul>
        <li>هذه النتيجة نسبية: تقارن كفاءاتك ببعضها بحسب قراراتك في أحداث هذا اليوم، وليست مستوى مطلقًا.</li>
        <li>اللعبة أداة استكشافية للتطوير، وليست تقييمًا نفسيًا معتمدًا ولا أساسًا لقرارات الترقية أو الأداء.</li>
        <li>قد تتغير النتيجة إذا أعدت اللعب، لأن القرارات تتأثر بالسياق. ناقشها مع مديرك أو زميل تثق به.</li></ul></div>
      <div class="actions no-print">
        <button class="btn red big" data-act="copy">نسخ نص التقرير</button>
        <button class="btn ghost" data-act="restart">العب من جديد</button>
      </div>
      <div id="copybox"></div>
    </section>`;
  }
  function reportText(R) {
    const L = ['اكتشف بصمتك القيادية — ' + R.date, '', R.summary, '', 'نقاط قوتك'];
    R.strs.forEach(s => { L.push('- ' + s.name); if (s.beh) L.push('  سلوك ظهر في قراراتك: ' + s.beh); });
    L.push('', 'فرصتك القادمة للتطور');
    R.pris.forEach((p, i) => {
      L.push('', (i + 1) + '. ' + p.name + ' (' + p.chip + ')', '   ' + p.def, '   لماذا ظهرت: ' + p.why + ' ' + p.contra);
      p.examples.forEach(x => L.push('   - ' + x.line));
      L.push('   سلوكيات يمكنك تحسينها:'); p.improve.forEach(b => L.push('     • ' + b));
      L.push('   اقتراح عملي: ' + p.tip, '   مستوى الثقة: ' + p.conf);
    });
    L.push('', 'ملاحظة: النتيجة نسبية، واللعبة أداة استكشافية للتطوير وليست تقييمًا نفسيًا معتمدًا ولا أساسًا لقرارات الترقية أو الأداء.');
    return L.join('\n');
  }

  /* ---------- لوحة المصمّمة (#designer) ---------- */
  const DIR = { 1: '＋', '-1': '−', 0: '٠' };
  function simAll(n) {
    const rng = E.mulberry(2024), ids = G.competencies.map(c => c.id), pri = {}, str = {};
    ids.forEach(c => { pri[c] = 0; str[c] = 0; });
    for (let i = 0; i < n; i++) { const r = E.analyze(G, E.simulate(G, E.randomPolicy, rng)); r.priorities.forEach(p => pri[p.id]++); r.strengths.forEach(s => str[s.id]++); }
    return { pri, str, n };
  }
  function designerScreen() {
    const cnt = {}; G.competencies.forEach(c => cnt[c.id] = 0); G.scenarios.forEach(sc => sc.comps.forEach(c => cnt[c]++));
    const sim = S.sim;
    const last = S.result;
    const matrix = G.scenarios.map(sc => `<details class="rc" style="padding:12px 14px"><summary><b>${sc.id.slice(1)}. ${esc(sc.title)}</b> · ${esc(sc.type)} · ${sc.comps.map(c => esc(comp(c).name)).join(' + ')}</summary>
      ${sc.options.map(o => `<div class="ex" style="margin-top:8px"><b>${o.id}.</b> ${esc(o.t)}<small>النتيجة السردية: ${esc(o.o)}</small>
        ${o.s.length ? o.s.map(s => `<small>${esc(comp(s.c).name)} | ${DIR[s.d]} | قوة ${s.k}${s.r ? ' | ' + s.r + ': ' + esc(G.behaviors[s.r] || G.notMeans[s.r] || '') : ''}${s.n ? ' | ' + esc(s.n) : ''}</small>`).join('') : ''}</div>`).join('')}</details>`).join('');
    return `<section class="screen report">
      <div class="r-head"><h1>لوحة المصمّمة</h1><p class="r-sum">تعرض هذه الصفحة طريقة احتساب النتائج كاملة لمراجعتها. الرابط ينتهي بـ #designer ولا يحميه رمز، فشاركيه مع من تثقين بهم فقط.</p></div>
      <div class="rc"><h3>إعدادات المحرك (engine.js)</h3><div class="ex">${Object.entries(E.CFG).map(([k, v]) => `${esc(k)} = ${Array.isArray(v) ? v.join(':') : v}`).join('<br>')}</div></div>
      <div class="rc"><h3>توازن فرص القياس</h3><div class="ex">${G.competencies.map(c => `${esc(c.name)}: ${cnt[c.id]} مواقف`).join('<br>')}</div></div>
      <div class="rc"><h3>محاكاة لاعبين عشوائيين</h3><button class="btn primary" data-act="sim">شغّل ٣٠٠٠ لاعب</button>
        ${sim ? `<div class="ex">${G.competencies.map(c => `${esc(c.name)}: أولوية تطوير ${(100 * sim.pri[c.id] / sim.n).toFixed(1)}٪ · نقطة قوة ${(100 * sim.str[c.id] / sim.n).toFixed(1)}٪`).join('<br>')}</div>` : ''}</div>
      <div class="rc"><h3>آخر جلسة لعب في هذه الصفحة</h3>${last ? `<div class="ex">${G.competencies.map(c => { const p = last.per[c.id]; return `${esc(c.name)}: المؤشر ${p.idx.toFixed(2)} · ${p.n} مواقف · تباين ${p.spread.toFixed(2)}`; }).join('<br>')}<small>الأولويات: ${last.priorities.map(p => esc(comp(p.id).name) + ' (' + p.confidence + ')').join('، ')}</small></div>` : '<p class="def">لم تُلعب جلسة بعد.</p>'}</div>
      <div class="sec-t"><span>مصفوفة الربط الكاملة</span></div>
      <p class="def" style="margin:0">رمز الاتجاه: ＋ سلوك إيجابي، − فرصة تطوير، ٠ محايد. القوة: ١ مباشرة، ٠٫٥ جزئية. المرجع: رقم السلوك أو بند «ما لا تعنيه» من الملف.</p>
      ${matrix}
      <div class="actions"><button class="btn ghost" data-act="exit-designer">العودة للعبة</button></div>
    </section>`;
  }

  /* ---------- الرسم والأحداث ---------- */
  function render() {
    const day = S.screen === 'report' || S.screen === 'designer';
    document.body.classList.toggle('day', day);
    const ci = (S.screen === 'chapter' || S.screen === 'scenario' || S.screen === 'outcome') ? chOf(scOf(S.idx).ch) : (S.screen === 'loading' ? chOf(8) : chOf(1));
    document.body.style.setProperty('--glow', ci.glow);
    document.body.classList.toggle('late', ci.n >= 7);
    const m = { start: startScreen, how: howScreen, name: nameScreen, chapter: chapterScreen, scenario: sceneScreen, outcome: outcomeScreen, loading: loadingScreen, report: reportScreen, designer: designerScreen };
    $app.innerHTML = m[S.screen]();
  }
  function burst(x, y) {
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span'); s.className = 'spark';
      const a = (i / 12) * Math.PI * 2, d = 40 + Math.random() * 40;
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 950);
    }
  }
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

  $app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    const act = t.dataset.act, sc = scOf(S.idx);
    if (act === 'how') go('how');
    else if (act === 'name') go('name');
    else if (act === 'begin') { const inp = document.getElementById('nm'); S.name = t.dataset.skip ? '' : (inp ? inp.value.trim().slice(0, 30) : ''); S.idx = 0; go('chapter'); }
    else if (act === 'next') go('scenario');
    else if (act === 'opt') {
      const id = t.dataset.id;
      if (sc.type === 'rank') { const k = S.rank.indexOf(id); if (k >= 0) S.rank.splice(k, 1); else if (S.rank.length < 3) S.rank.push(id); }
      else S.pick = id;
      const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
      render();
    }
    else if (act === 'confirm') {
      S.answers[sc.id] = sc.type === 'rank' ? { rank: S.rank.slice() } : { pick: S.pick };
      const chosen = sc.options.find(o => o.id === (sc.type === 'rank' ? S.rank[0] : S.pick)); if (chosen && chosen.set) S.flags[chosen.set] = 1;
      S.pick = null; S.rank = []; go('outcome');
    }
    else if (act === 'cont') {
      if (S.idx === G.scenarios.length - 1) {
        go('loading');
        setTimeout(() => { S.result = E.analyze(G, S.answers); S.report = buildReport(S.result, S.name); go('report'); }, 1800);
      } else { S.idx++; go(scOf(S.idx).ch !== scOf(S.idx - 1).ch ? 'chapter' : 'scenario'); }
    }
    else if (act === 'restart') { fresh(S.name); go('start'); }
    else if (act === 'copy') {
      const txt = reportText(S.report), box = document.getElementById('copybox');
      const fallback = () => { box.innerHTML = '<div class="read"><h3>انسخي النص من هنا</h3><textarea id="ct" readonly rows="10" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line)"></textarea></div>'; const ta = document.getElementById('ct'); ta.value = txt; ta.focus(); ta.select(); };
      try { navigator.clipboard.writeText(txt).then(() => toast('تم نسخ التقرير'), fallback); } catch (err) { fallback(); }
    }
    else if (act === 'sim') { S.sim = simAll(3000); render(); }
    else if (act === 'exit-designer') { location.hash = ''; }
  });

  function route() {
    if (location.hash === '#designer') { S.prev = S.screen === 'designer' ? S.prev : S.screen; go('designer'); }
    else if (S.screen === 'designer') go(S.prev && S.prev !== 'loading' ? S.prev : 'start');
  }
  window.addEventListener('hashchange', route);

  /* خلفية المدينة: توهّج يتغير مع ساعات اليوم */
  const sky = document.createElement('div'); sky.className = 'sky'; sky.setAttribute('aria-hidden', 'true');
  let st = ''; for (let i = 0; i < 30; i++) st += `<i class="star" style="left:${(i * 53 % 100)}%;top:${(i * 29 % 50)}%;animation-delay:${(i % 7) * .6}s"></i>`;
  let bl = '', x = 0; const hs = [58, 84, 46, 96, 70, 52, 88, 64, 78, 50];
  hs.forEach((h, k) => { const w = 34 + (k * 7 % 20); bl += `<rect x="${x}" y="${120 - h}" width="${w}" height="${h}" fill="#1A0A09"/>`; for (let r = 0; r < 4; r++) if ((k + r) % 2 === 0) bl += `<rect x="${x + 7}" y="${120 - h + 8 + r * 14}" width="5" height="6" fill="#FFC72C" opacity=".55"/>`; x += w + 2; });
  sky.innerHTML = '<div class="glow"></div>' + st + `<svg class="city" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice">${bl}</svg>`;
  document.body.prepend(sky);

  window.__GAME_STATE = () => S; /* للاختبار الآلي فقط */
  render(); route();
})();

</script>
